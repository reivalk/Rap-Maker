<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自訂節拍與饒舌產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: white; font-family: sans-serif; }
    .active { border-color: #14b8a6 !important; background-color: rgba(20, 184, 166, 0.2) !important; }
    .playing { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
    .beat-card { padding: 1rem; border-radius: 0.5rem; border: 1px solid rgba(204, 251, 241, 0.15); background-color: rgba(0, 0, 0, 0.2); }
    .field { width: 100%; padding: 0.5rem; border-radius: 0.25rem; background: #1e293b; color: white; border: 1px solid #334155; }
    /* 確保圖片在深色背景上清楚顯示，如果您的圖片是白底黑字，這裡可以加上反轉濾鏡 */
    .rhythm-img { height: 40px; margin: 0 auto; object-fit: contain; filter: invert(1); }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-center text-teal-400 mb-6">自訂節拍與饒舌產生器</h1>

    <!-- 控制面板 -->
    <div class="bg-gray-800 p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <button id="play-button" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition"><i data-lucide="play" class="w-5 h-5"></i> 實時播放 (含人聲)</button>
        <button id="stop-button" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition"><i data-lucide="square" class="w-5 h-5"></i> 停止</button>
      </div>
      <div class="text-sm text-teal-200">※ 提示：匯出 WAV 功能目前僅支援樂器節拍聲，人聲請透過實時播放聆聽。</div>
    </div>

    <!-- 狀態面板 -->
    <div class="bg-gray-800 p-4 rounded-xl flex items-center gap-4 shadow-lg">
      <div id="status-dot" class="w-4 h-4 rounded-full bg-gray-500 transition-colors"></div>
      <div id="play-status" class="font-bold text-teal-300">READY / 等待開始</div>
      <div id="active-line" class="text-gray-400 text-sm">第一句 · 第 1 拍</div>
      <div id="active-lyric" class="text-white ml-auto font-mono text-lg font-bold">READY?</div>
    </div>

    <!-- 節拍參考區 -->
    <div class="grid grid-cols-2 md:grid-cols-7 gap-2" id="guide-list"></div>

    <!-- 歌詞編輯區 -->
    <div class="space-y-4" id="lines-list"></div>
  </div>

  <script>
    // 這裡的第三個參數，是對應您切好的圖片檔名
    const rhythms = [
      ["quarter", "一拍", "images/img_1.png"],
      ["eighth", "兩個半拍", "images/img_2.png"],
      ["triplet", "三連音", "images/img_3.png"],
      ["sixteenth", "四個1/4拍", "images/img_4.png"],
      ["long-short-short", "長短短", "images/img_5.png"],
      ["short-short-long", "短短長", "images/img_6.png"],
      ["offbeat", "後半拍", "images/img_7.png"]
    ];
    let ctx, timers = [], playing = false;

    function cardsMarkup(line){
      return Array.from({length:4},(_,i)=>`<div class="beat-card" data-card>
        <div class="flex justify-between mb-2"><span class="font-bold text-teal-300">${i+1}</span><span class="text-[10px] text-teal-100/45">BEAT</span></div>
        <div class="mb-4 text-center h-10 flex items-center justify-center">
            <img data-symbol src="images/img_1.png" class="rhythm-img" alt="音符">
        </div>
        <label class="sr-only" for="r${line}-${i}">節奏</label>
        <select id="r${line}-${i}" class="field rhythm mb-2 text-sm">${rhythms.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("")}</select>
        <label class="sr-only" for="t${line}-${i}">歌詞</label>
        <input id="t${line}-${i}" class="field lyric" type="text" placeholder="輸入歌詞">
      </div>`).join("");
    }

    function build(){
      document.getElementById("guide-list").innerHTML = rhythms.map(r=>`
        <div class="rounded-xl border border-teal-100/15 bg-gray-800 p-2">
            <div class="h-10 flex items-center justify-center mb-1">
                <img src="${r[2]}" alt="${r[1]}" class="rhythm-img" onerror="this.outerHTML='<span class=\\'text-xs text-red-400\\'>圖片遺失</span>'">
            </div>
            <p class="text-center text-[11px] text-teal-100 font-bold">${r[1]}</p>
        </div>`).join("");
      
      document.getElementById("lines-list").innerHTML = ["第一句","第二句","第三句","第四句"].map((name,i)=>`
        <section class="rounded-2xl border border-teal-100/15 bg-gray-800 p-4 shadow-lg">
            <div class="flex justify-between mb-3"><h3 class="font-bold text-lg text-teal-400">${name}</h3><span class="text-xs text-teal-100/55">完成四拍</span></div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">${cardsMarkup(i)}</div>
        </section>`).join("");
      
      document.querySelectorAll(".rhythm").forEach(s => s.addEventListener("change", () => {
          const imgPath = rhythms.find(r => r[0] === s.value)[2];
          s.closest("[data-card]").querySelector("[data-symbol]").src = imgPath;
      }));
    }

    function stop(){
      playing = false; 
      timers.forEach(clearTimeout); 
      timers = [];
      window.speechSynthesis.cancel(); // 停止所有語音
      document.querySelectorAll("[data-card]").forEach(c => c.classList.remove("active"));
      if(ctx){ ctx.close().catch(()=>{}); ctx=null; }
      stage(false, "READY / 等待開始", "第一句 · 第 1 拍", "READY?");
    }

    function stage(on, status, line, lyric){
        document.getElementById("status-dot").classList.toggle("playing", on);
        document.getElementById("play-status").textContent = status;
        document.getElementById("active-line").textContent = line;
        document.getElementById("active-lyric").textContent = lyric;
    }

    function ratios(type){
        return ({quarter:[0], eighth:[0,.5], triplet:[0,1/3,2/3], sixteenth:[0,.25,.5,.75], "long-short-short":[0,.5,.75], "short-short-long":[0,.25,.5], offbeat:[.5]})[type] || [0];
    }
    
    // 合成樂器節拍聲
    function tone(audio, time, freq, duration, voice, dest){
      const osc = audio.createOscillator(), gain = audio.createGain(), filter = audio.createBiquadFilter();
      osc.type = voice === "low" ? "triangle" : "sawtooth"; 
      osc.frequency.setValueAtTime(freq, time);
      osc.frequency.exponentialRampToValueAtTime(freq*.96, time+duration);
      filter.type = "bandpass"; filter.frequency.value = voice === "low" ? 750 : 1250; filter.Q.value = 2;
      gain.gain.setValueAtTime(.0001, time);
      gain.gain.exponentialRampToValueAtTime(.15, time+.025);
      gain.gain.exponentialRampToValueAtTime(.0001, time+duration);
      osc.connect(filter); filter.connect(gain); gain.connect(dest);
      osc.start(time); osc.stop(time+duration+.04);
    }

    function beat(audio, time, dest){
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.setValueAtTime(130, time);
        o.frequency.exponentialRampToValueAtTime(48, time+.13);
        g.gain.setValueAtTime(.25, time);
        g.gain.exponentialRampToValueAtTime(.001, time+.14);
        o.connect(g); g.connect(dest);
        o.start(time); o.stop(time+.15);
    }

    async function perform(){
      const all = [...document.querySelectorAll("[data-card]")];
      const has = all.some(c => c.querySelector(".lyric").value.trim());
      if(!has){ stage(false, "請先填入歌詞", "第一句 · 第 1 拍", "先寫一拍歌詞"); document.querySelector(".lyric").focus(); return; }
      
      stop(); 
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      
      const bpm = 75, dur = 60/bpm; // 放慢 BPM 讓中文語音有時間唸完
      
      ctx = new AC();
      await ctx.resume();
      playing = true;
      const start = ctx.currentTime + 0.2;
      
      all.forEach((card, index) => {
        const type = card.querySelector(".rhythm").value;
        const lyric = card.querySelector(".lyric").value.trim() || "—";
        const when = start + index * dur;
        const line = Math.floor(index/4) + 1;
        const beatNo = index % 4 + 1;
        
        // 視覺與狀態更新
        timers.push(setTimeout(() => {
            if(!playing) return;
            document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
            card.classList.add("active");
            stage(true, "LIVE / 播放中", `第${["一","二","三","四"][line-1]}句 · 第 ${beatNo} 拍`, lyric);
        }, Math.max(0, (when - ctx.currentTime) * 1000)));

        // 樂器發聲
        beat(ctx, when, ctx.destination);
        const pattern = ratios(type);
        pattern.forEach((ratio, p) => {
            const next = pattern[p+1] ?? 1;
            const noteDuration = Math.max(.08, (next-ratio) * dur * .75);
            tone(ctx, when + ratio * dur, 235 + p*28, noteDuration, "bright", ctx.destination);
        });

        // TTS 歌詞語音朗讀 (對齊發聲節點)
        if (lyric !== "—") {
            const syllables = [...lyric.replace(/\s+/g, "")];
            syllables.forEach((syllable, charIndex) => {
                const ratio = pattern[charIndex] !== undefined ? pattern[charIndex] : (pattern[pattern.length-1] || 0);
                const ttsWhen = (when + ratio * dur - ctx.currentTime) * 1000;
                
                timers.push(setTimeout(() => {
                    if(!playing) return;
                    const msg = new SpeechSynthesisUtterance(syllable);
                    msg.lang = 'zh-TW';
                    msg.rate = 1.8; // 稍微加快語速，避免字擠在一起
                    msg.pitch = 1.0;
                    window.speechSynthesis.speak(msg);
                }, Math.max(0, ttsWhen)));
            });
        }
      });
      
      const end = (all.length * dur + .35) * 1000;
      timers.push(setTimeout(() => {
          playing = false;
          document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
          stage(false, "DONE / 節拍結束", "完成", "MIC DROP");
          if(ctx){ ctx.close().catch(()=>{}); ctx=null; }
      }, end));
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        build();
        document.getElementById("play-button").onclick = () => perform();
        document.getElementById("stop-button").onclick = stop;
        lucide.createIcons();
    });
  </script>
</body>
</html>
