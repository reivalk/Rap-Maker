<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自訂節拍與饒舌產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: white; font-family: sans-serif; touch-action: manipulation; }
    .active { border-color: #14b8a6 !important; background-color: rgba(20, 184, 166, 0.2) !important; }
    .playing { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
    .beat-card { padding: 1rem; border-radius: 0.5rem; border: 1px solid rgba(204, 251, 241, 0.15); background-color: rgba(0, 0, 0, 0.2); }
    .field { width: 100%; padding: 0.5rem; border-radius: 0.25rem; background: #1e293b; color: white; border: 1px solid #334155; outline: none; }
    .field:focus { border-color: #14b8a6; }
    .rhythm-img { height: 40px; margin: 0 auto; object-fit: contain; filter: invert(1); }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-2xl md:text-3xl font-bold text-center text-teal-400 mb-6">自訂節拍與饒舌產生器</h1>

    <!-- 控制面板 -->
    <div class="bg-gray-800 p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between shadow-lg">
      <div class="flex flex-wrap items-center gap-3">
        <button id="play-button" class="bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition select-none">
          <i data-lucide="play" class="w-5 h-5"></i> 實時播放 (含人聲)
        </button>
        <button id="download-button" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition select-none">
          <i data-lucide="download" class="w-5 h-5"></i> 下載節拍檔
        </button>
        <button id="stop-button" class="bg-red-600 hover:bg-red-500 active:bg-red-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition select-none">
          <i data-lucide="square" class="w-5 h-5"></i> 停止
        </button>
      </div>

      <!-- 人聲延遲校正微調器 -->
      <div class="flex items-center gap-2 bg-gray-900/60 px-3 py-1.5 rounded-lg border border-teal-500/30">
        <label for="offset-range" class="text-xs text-teal-300 font-bold whitespace-nowrap">人聲對位校正:</label>
        <input id="offset-range" type="range" min="30" max="350" value="180" class="w-24 accent-teal-400">
        <span id="offset-val" class="text-xs font-mono text-teal-200 w-12">180ms</span>
      </div>
    </div>

    <!-- 狀態面板（更新：支援同步顯示節奏圖片） -->
    <div class="bg-gray-800 p-4 rounded-xl flex items-center gap-4 shadow-lg">
      <div id="status-dot" class="w-4 h-4 rounded-full bg-gray-500 transition-colors"></div>
      <div id="play-status" class="font-bold text-teal-300">READY / 等待開始</div>
      <div id="active-line" class="text-gray-400 text-sm">第一句 · 第 1 拍</div>
      
      <!-- 動態節奏圖片與歌詞 -->
      <div class="ml-auto flex items-center gap-3">
        <img id="active-img" class="h-8 w-auto object-contain filter invert hidden" alt="當前節奏">
        <div id="active-lyric" class="text-white font-mono text-lg font-bold">READY?</div>
      </div>
    </div>

    <!-- 節拍參考區 -->
    <div class="grid grid-cols-2 md:grid-cols-7 gap-2" id="guide-list"></div>

    <!-- 歌詞編輯區 -->
    <div class="space-y-4" id="lines-list"></div>
  </div>

  <script>
    const rhythms = [
      ["quarter", "一拍", "images/img_1.png"],
      ["eighth", "兩個半拍", "images/img_2.png"],
      ["triplet", "三連音", "images/img_3.png"],
      ["sixteenth", "四個1/4拍", "images/img_4.png"],
      ["long-short-short", "長短短", "images/img_5.png"],
      ["short-short-long", "短短長", "images/img_6.png"],
      ["offbeat", "後半拍", "images/img_7.png"]
    ];

    const rhythmWordLimits = {
      "quarter": 1, "eighth": 2, "triplet": 3, "sixteenth": 4,
      "long-short-short": 3, "short-short-long": 3, "offbeat": 1
    };

    let ctx = null, timers = [], playing = false;
    let mediaRecorder = null, recordedChunks = [];
    let voiceOffsetMs = 180;

    // 手機端 Audio 觸控解鎖
    function initOrUnlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!ctx && AC) {
        ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') {
        ctx.resume();
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        const dummy = new SpeechSynthesisUtterance('');
        dummy.volume = 0.01;
        window.speechSynthesis.speak(dummy);
      }
    }

    function cardsMarkup(line){
      return Array.from({length:4},(_,i)=>`<div class="beat-card" data-card>
        <div class="flex justify-between mb-2"><span class="font-bold text-teal-300">${i+1}</span><span class="text-[10px] text-teal-100/45">BEAT</span></div>
        <div class="mb-4 text-center h-10 flex items-center justify-center">
            <img data-symbol src="images/img_1.png" class="rhythm-img" alt="音符">
        </div>
        <label class="sr-only" for="r${line}-${i}">節奏</label>
        <select id="r${line}-${i}" class="field rhythm mb-2 text-sm">${rhythms.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("")}</select>
        <label class="sr-only" for="t${line}-${i}">歌詞</label>
        <input id="t${line}-${i}" class="field lyric text-center font-bold text-lg" type="text" placeholder="最多 1 字">
      </div>`).join("");
    }

    function updateInputLimit(selectElement) {
      const type = selectElement.value;
      const maxLen = rhythmWordLimits[type];
      const input = selectElement.closest("[data-card]").querySelector(".lyric");
      input.maxLength = maxLen;
      input.placeholder = `最多 ${maxLen} 字`;
      if (input.value.length > maxLen) {
        input.value = input.value.substring(0, maxLen);
      }
    }

    function build(){
      document.getElementById("guide-list").innerHTML = rhythms.map(r=>`
        <div class="rounded-xl border border-teal-100/15 bg-gray-800 p-2">
            <div class="h-10 flex items-center justify-center mb-1">
                <img src="${r[2]}" alt="${r[1]}" class="rhythm-img" onerror="this.outerHTML='<span class=\\'text-xs text-red-400\\'>圖片遺失</span>'">
            </div>
            <p class="text-center text-[11px] text-teal-100 font-bold">${r[1]}</p>
        </div>`).join("");

      document.getElementById("lines-list").innerHTML = ["第一句","第二句","第三句","第四句"].map((name,i)=>`
        <section class="rounded-2xl border border-teal-100/15 bg-gray-800 p-4 shadow-lg">
            <div class="flex justify-between mb-3"><h3 class="font-bold text-lg text-teal-400">${name}</h3><span class="text-xs text-teal-100/55">完成四拍</span></div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">${cardsMarkup(i)}</div>
        </section>`).join("");

      document.querySelectorAll(".rhythm").forEach(s => {
        s.addEventListener("change", () => {
          const imgPath = rhythms.find(r => r[0] === s.value)[2];
          s.closest("[data-card]").querySelector("[data-symbol]").src = imgPath;
          updateInputLimit(s);
        });
        updateInputLimit(s);
      });

      const offsetInput = document.getElementById("offset-range");
      offsetInput.addEventListener("input", (e) => {
        voiceOffsetMs = parseInt(e.target.value);
        document.getElementById("offset-val").textContent = voiceOffsetMs + "ms";
      });
    }

    function stop(){
      playing = false;
      timers.forEach(clearTimeout);
      timers = [];
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      document.querySelectorAll("[data-card]").forEach(c => c.classList.remove("active"));
      if (ctx) { ctx.close().catch(()=>{}); ctx = null; }
      stage(false, "READY / 等待開始", "第一句 · 第 1 拍", "READY?", null);
    }

    function stage(on, status, line, lyric, imgSrc = null){
      document.getElementById("status-dot").classList.toggle("playing", on);
      document.getElementById("play-status").textContent = status;
      document.getElementById("active-line").textContent = line;
      document.getElementById("active-lyric").textContent = lyric;

      const imgEl = document.getElementById("active-img");
      if (on && imgSrc) {
        imgEl.src = imgSrc;
        imgEl.classList.remove("hidden");
      } else {
        imgEl.classList.add("hidden");
      }
    }

    function ratios(type){
      return ({
        quarter: [0],
        eighth: [0, 0.5],
        triplet: [0, 1/3, 2/3],
        sixteenth: [0, 0.25, 0.5, 0.75],
        "long-short-short": [0, 0.5, 0.75],
        "short-short-long": [0, 0.25, 0.5],
        offbeat: [0.5]
      })[type] || [0];
    }

    function getSyllableRates(type, length) {
      if (type === 'long-short-short') return [1.2, 2.2, 2.2];
      if (type === 'short-short-long') return [2.2, 2.2, 1.2];
      if (type === 'triplet') return [1.8, 1.8, 1.8];
      if (type === 'sixteenth') return [2.3, 2.3, 2.3, 2.3];
      if (type === 'eighth') return [1.5, 1.5];
      return Array(length).fill(1.3);
    }

    // 響亮清晰的細分節拍聲
    function tone(audio, time, freq, duration, voice, dest){
      const osc = audio.createOscillator(), gain = audio.createGain(), filter = audio.createBiquadFilter();
      osc.type = "square"; // 方波：讓高頻更清晰突出
      osc.frequency.setValueAtTime(freq * 1.2, time);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.9, time + duration);

      filter.type = "highshelf";
      filter.frequency.value = 1000;
      filter.gain.value = 6; // 增加高頻清晰度

      gain.gain.setValueAtTime(0.001, time);
      gain.gain.exponentialRampToValueAtTime(0.4, time + 0.015); // 音量提升至 0.4
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

      osc.connect(filter); filter.connect(gain); gain.connect(dest);
      osc.start(time); osc.stop(time + duration + 0.05);
    }

    // 重響且扎實的主節拍聲 (Kick + High Click)
    function beat(audio, time, dest){
      // 重打低音鼓
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.setValueAtTime(220, time);
      o.frequency.exponentialRampToValueAtTime(38, time + 0.18);

      g.gain.setValueAtTime(0.7, time); // 主節拍音量提升至 0.7
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);

      o.connect(g); g.connect(dest);
      o.start(time); o.stop(time + 0.22);

      // 清晰點擊聲 (讓節奏正拍極度顯眼響亮)
      const snap = audio.createOscillator(), snapG = audio.createGain();
      snap.type = "triangle";
      snap.frequency.setValueAtTime(1200, time);
      snap.frequency.exponentialRampToValueAtTime(200, time + 0.03);
      snapG.gain.setValueAtTime(0.4, time);
      snapG.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
      snap.connect(snapG); snapG.connect(dest);
      snap.start(time); snap.stop(time + 0.04);
    }

    async function perform(isRecording = false){
      initOrUnlockAudio();

      const all = [...document.querySelectorAll("[data-card]")];
      const hasContent = all.some(c => c.querySelector(".lyric").value.trim() !== "");
      if(!hasContent){
        stage(false, "請先填入歌詞", "第一句 · 第 1 拍", "先寫一拍歌詞", null);
        return;
      }

      stop();
      initOrUnlockAudio();

      const masterGain = ctx.createGain();
      masterGain.connect(ctx.destination);

      if (isRecording) {
        const streamDest = ctx.createMediaStreamDestination();
        masterGain.connect(streamDest);
        recordedChunks = [];
        
        let mimeType = '';
        if (typeof MediaRecorder !== 'undefined') {
          if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
          else if (MediaRecorder.isTypeSupported('audio/aac')) mimeType = 'audio/aac';
          else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
        }
        
        try {
          mediaRecorder = mimeType ? new MediaRecorder(streamDest.stream, { mimeType }) : new MediaRecorder(streamDest.stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const ext = mimeType.includes('mp4') || mimeType.includes('aac') ? 'm4a' : 'webm';
            const blob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `custom_beat.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
          };
          mediaRecorder.start();
        } catch(e) {
          alert("您的手機瀏覽器不支援直接下載音檔功能");
        }
      }

      await ctx.resume();
      playing = true;
      const bpm = 70, dur = 60/bpm;
      const start = ctx.currentTime + 0.4;

      all.forEach((card, index) => {
        const type = card.querySelector(".rhythm").value;
        const lyric = card.querySelector(".lyric").value.trim();
        const when = start + index * dur;
        const line = Math.floor(index/4) + 1;
        const beatNo = index % 4 + 1;
        const pattern = ratios(type);

        const rhythmObj = rhythms.find(r => r[0] === type);
        const imgSrc = rhythmObj ? rhythmObj[2] : null;

        // UI 燈號與圖像文字同步更新
        timers.push(setTimeout(() => {
          if(!playing) return;
          document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
          card.classList.add("active");
          stage(true, isRecording ? "RECORDING / 錄音中" : "LIVE / 播放中", `第${["一","二","三","四"][line-1]}句 · 第 ${beatNo} 拍`, lyric || "—", imgSrc);
        }, Math.max(0, (when - ctx.currentTime) * 1000)));

        // 樂器拍點發聲 (響亮鼓聲)
        beat(ctx, when, masterGain);
        pattern.forEach((ratio, p) => {
          const next = pattern[p+1] ?? 1;
          const noteDuration = Math.max(.08, (next-ratio) * dur * .75);
          tone(ctx, when + ratio * dur, 235 + p*28, noteDuration, "bright", masterGain);
        });

        // 人聲朗讀
        if (lyric && !isRecording && ('speechSynthesis' in window)) {
          const syllables = [...lyric.replace(/\s+/g, "")];
          const maxLen = rhythmWordLimits[type];
          const rates = getSyllableRates(type, syllables.length);

          for(let i = 0; i < Math.min(syllables.length, maxLen); i++) {
            const char = syllables[i];
            const ratio = pattern[i];
            const targetTimeSec = when + ratio * dur;
            const triggerDelayMs = (targetTimeSec - ctx.currentTime) * 1000 - voiceOffsetMs;

            timers.push(setTimeout(() => {
              if(!playing) return;
              const msg = new SpeechSynthesisUtterance(char);
              msg.lang = 'zh-TW';
              msg.rate = rates[i] || 1.4;
              window.speechSynthesis.speak(msg);
            }, Math.max(0, triggerDelayMs)));
          }
        }
      });

      const end = (all.length * dur + 0.6) * 1000;
      timers.push(setTimeout(() => {
        playing = false;
        document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
        stage(false, "DONE / 節拍結束", "完成", "MIC DROP", null);
        if(isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if(ctx){ ctx.close().catch(()=>{}); ctx=null; }
      }, end));
    }

    document.addEventListener("DOMContentLoaded", () => {
      build();
      const playBtn = document.getElementById("play-button");
      const downloadBtn = document.getElementById("download-button");
      const stopBtn = document.getElementById("stop-button");

      playBtn.onclick = () => perform(false);
      downloadBtn.onclick = () => perform(true);
      stopBtn.onclick = stop;

      playBtn.addEventListener("touchstart", initOrUnlockAudio, { passive: true });
      downloadBtn.addEventListener("touchstart", initOrUnlockAudio, { passive: true });

      lucide.createIcons();
    });
  </script>
</body>
</html>
