<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自訂節拍與饒舌產生器 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #fefce8; color: #451a03; font-family: sans-serif; touch-action: manipulation; }
    .active { border-color: #d97706 !important; background-color: #fef3c7 !important; box-shadow: 0 0 12px rgba(217, 119, 6, 0.3); }
    .playing { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
    .beat-card { padding: 1rem; border-radius: 0.5rem; border: 1px solid #fde68a; background-color: #ffffff; position: relative; }
    .field { width: 100%; padding: 0.5rem; border-radius: 0.25rem; background: #fffbebf0; color: #451a03; border: 1px solid #fcd34d; outline: none; }
    .field:focus { border-color: #d97706; }
    .rhythm-img { height: 40px; margin: 0 auto; object-fit: contain; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-2xl md:text-3xl font-bold text-center text-amber-800 mb-2">自訂節拍與饒舌產生器 <span class="text-amber-500">Pro</span></h1>
    
    <!-- 預設範例列 -->
    <div class="flex flex-wrap items-center justify-center gap-3 mb-4">
      <span class="text-sm font-bold text-amber-700">快速帶入範例：</span>
      <button onclick="loadPreset('boombap')" class="px-3 py-1.5 bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-full text-sm font-bold transition">🎧 嘻哈 Boom Bap</button>
      <button onclick="loadPreset('trap')" class="px-3 py-1.5 bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-full text-sm font-bold transition">🔥 輕快 Trap</button>
      <button onclick="loadPreset('pop')" class="px-3 py-1.5 bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-full text-sm font-bold transition">🌊 流行 R&B</button>
      <button onclick="clearAll()" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full text-sm font-bold transition">🗑️ 清空</button>
    </div>

    <!-- 控制面板 1: 核心播放 -->
    <div class="bg-amber-100/90 border border-amber-300 p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between shadow-sm">
      <div class="flex flex-wrap items-center gap-3">
        <button id="play-button" class="bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-bold transition select-none shadow">
          <i data-lucide="play" class="w-5 h-5"></i> 實時播放
        </button>
        <button id="download-button" class="bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-bold transition select-none shadow">
          <i data-lucide="download" class="w-5 h-5"></i> 錄製下載
        </button>
        <button id="stop-button" class="bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-bold transition select-none shadow">
          <i data-lucide="square" class="w-5 h-5"></i> 停止
        </button>
      </div>

      <div class="flex items-center gap-2 bg-amber-200/80 px-3.5 py-2 rounded-lg border border-amber-300 shadow-sm">
        <label for="bpm-range" class="text-xs text-amber-900 font-bold whitespace-nowrap">速度 (BPM):</label>
        <input id="bpm-range" type="range" min="40" max="160" value="85" class="w-24 accent-amber-600">
        <span id="bpm-val" class="text-xs font-mono font-bold text-amber-950 w-14">85 BPM</span>
      </div>
    </div>

    <!-- 控制面板 2: 音效設定 -->
    <div class="bg-amber-50/80 border border-amber-200 p-3 rounded-xl flex flex-wrap gap-6 items-center shadow-sm text-sm">
      <label class="flex items-center gap-2 font-bold text-amber-900 cursor-pointer">
        <input type="checkbox" id="count-in-toggle" checked class="w-4 h-4 accent-amber-600">
        播放前預備倒數 4 拍
      </label>
      <div class="h-4 w-px bg-amber-300 hidden md:block"></div>
      <label class="flex items-center gap-2 font-bold text-amber-900">
        細分拍音色:
        <select id="subbeat-sound" class="bg-white border border-amber-300 rounded px-2 py-1 outline-none focus:border-amber-500">
          <option value="hihat">清脆鈸聲 (Hi-Hat)</option>
          <option value="snare">小鼓聲 (Snare)</option>
        </select>
      </label>
    </div>

    <!-- 狀態面板 -->
    <div class="bg-amber-100/90 border border-amber-300 p-4 rounded-xl flex items-center gap-4 shadow-md sticky top-2 z-10">
      <div id="status-dot" class="w-4 h-4 rounded-full bg-amber-400 transition-colors"></div>
      <div id="play-status" class="font-bold text-amber-900">READY / 等待開始</div>
      <div id="active-line" class="text-amber-700 text-sm hidden md:block">--</div>
      
      <div class="ml-auto flex items-center gap-3 bg-white px-4 py-1.5 rounded-lg border border-amber-200 min-w-[140px] justify-end shadow-sm">
        <img id="active-img" class="h-8 w-auto object-contain hidden" alt="當前節奏">
        <div id="active-lyric" class="text-amber-950 font-mono text-xl font-bold">READY?</div>
      </div>
    </div>

    <!-- 節拍參考區 -->
    <div class="grid grid-cols-2 md:grid-cols-7 gap-2" id="guide-list"></div>

    <!-- 歌詞編輯區 -->
    <div class="space-y-4" id="lines-list"></div>

    <!-- 動態操作區 -->
    <div class="flex justify-center gap-4 mt-6">
      <button onclick="addLine()" class="px-6 py-3 bg-white border-2 border-dashed border-amber-400 hover:border-amber-600 hover:bg-amber-50 text-amber-700 font-bold rounded-xl transition flex items-center gap-2">
        <i data-lucide="plus" class="w-5 h-5"></i> 新增空白句
      </button>
      <button onclick="duplicateLastLine()" class="px-6 py-3 bg-amber-200 border-2 border-amber-300 hover:bg-amber-300 text-amber-800 font-bold rounded-xl transition flex items-center gap-2">
        <i data-lucide="copy" class="w-5 h-5"></i> 複製最後一句
      </button>
    </div>
  </div>

  <script>
    const rhythms = [
      ["quarter", "一拍", "images/img_1.png"],
      ["eighth", "兩個半拍", "images/img_2.png"],
      ["triplet", "三連音", "images/img_3.png"],
      ["sixteenth", "四個1/4拍", "images/img_4.png"],
      ["long-short-short", "長短短", "images/img_5.png"],
      ["short-short-long", "短短長", "images/img_6.png"],
      ["offbeat", "後半拍", "images/img_7.png"]
    ];

    const rhythmWordLimits = {
      "quarter": 1, "eighth": 2, "triplet": 3, "sixteenth": 4,
      "long-short-short": 3, "short-short-long": 3, "offbeat": 1
    };

    let ctx = null, timers = [], playing = false;
    let mediaRecorder = null, recordedChunks = [];
    let lineCounter = 0;

    // 建立上方圖例
    document.getElementById("guide-list").innerHTML = rhythms.map(r=>`
      <div class="rounded-xl border border-amber-200 bg-amber-100/70 p-2 text-center">
          <div class="h-10 flex items-center justify-center mb-1">
              <img src="${r[2]}" alt="${r[1]}" class="rhythm-img" onerror="this.outerHTML='<span class=\\'text-[10px] text-red-500\\'>請補圖片<br>${r[2]}</span>'">
          </div>
          <p class="text-center text-[11px] text-amber-900 font-bold">${r[1]}</p>
      </div>`).join("");

    // 初始化音訊
    function initOrUnlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!ctx && AC) ctx = new AC();
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }

    // 綁定節奏切換事件
    function attachCardEvents(card) {
      const select = card.querySelector(".rhythm");
      const input = card.querySelector(".lyric");
      const img = card.querySelector("[data-symbol]");
      
      const updateLimit = () => {
        const type = select.value;
        const maxLen = rhythmWordLimits[type];
        input.maxLength = maxLen;
        input.placeholder = `最多 ${maxLen} 字`;
        if (input.value.length > maxLen) input.value = input.value.substring(0, maxLen);
        const rData = rhythms.find(r => r[0] === type);
        if(rData) img.src = rData[2];
      };

      select.addEventListener("change", updateLimit);
      updateLimit();
    }

    // 新增一句 UI
    function addLine(data = null) {
      lineCounter++;
      const currentLineId = lineCounter;
      const section = document.createElement("section");
      section.className = "rounded-2xl border border-amber-300 bg-amber-100/80 p-4 shadow-md relative line-section";
      
      let cardsHtml = "";
      for(let i=0; i<4; i++) {
        const d = data && data[i] ? data[i] : {r: "quarter", l: ""};
        cardsHtml += `
        <div class="beat-card" data-card>
          <div class="flex justify-between mb-2"><span class="font-bold text-amber-800">${i+1}</span><span class="text-[10px] text-amber-600 font-semibold">BEAT</span></div>
          <div class="mb-4 text-center h-10 flex items-center justify-center">
              <img data-symbol src="images/img_1.png" class="rhythm-img" alt="音符">
          </div>
          <select class="field rhythm mb-2 text-sm font-medium">
            ${rhythms.map(r=>`<option value="${r[0]}" ${r[0]===d.r ? 'selected':''}>${r[1]}</option>`).join("")}
          </select>
          <input class="field lyric text-center font-bold text-lg" type="text" value="${d.l}" placeholder="最多 1 字">
        </div>`;
      }

      section.innerHTML = `
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-lg text-amber-900 line-title">第 ${currentLineId} 句</h3>
          <button onclick="removeLine(this)" class="text-rose-500 hover:text-rose-700 text-sm font-bold flex items-center gap-1 transition p-1 rounded hover:bg-rose-100"><i data-lucide="trash-2" class="w-4 h-4"></i>刪除此句</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">${cardsHtml}</div>
      `;

      document.getElementById("lines-list").appendChild(section);
      section.querySelectorAll("[data-card]").forEach(attachCardEvents);
      updateLineNumbers();
      lucide.createIcons();
    }

    function removeLine(btn) {
      btn.closest('.line-section').remove();
      updateLineNumbers();
    }

    function updateLineNumbers() {
      const sections = document.querySelectorAll('.line-section');
      sections.forEach((sec, idx) => {
        sec.querySelector('.line-title').textContent = `第 ${idx + 1} 句`;
      });
      lineCounter = sections.length;
    }

    function duplicateLastLine() {
      const sections = document.querySelectorAll('.line-section');
      if(sections.length === 0) { addLine(); return; }
      const lastSection = sections[sections.length - 1];
      const data = [...lastSection.querySelectorAll('[data-card]')].map(card => ({
        r: card.querySelector('.rhythm').value,
        l: card.querySelector('.lyric').value
      }));
      addLine(data);
    }

    function clearAll() {
      document.getElementById("lines-list").innerHTML = "";
      lineCounter = 0;
      addLine();
    }

    // 預設範例資料庫
    const presetData = {
      boombap: [
        [{r:"quarter",l:"Yo"}, {r:"eighth",l:"聽我"}, {r:"eighth",l:"節奏"}, {r:"quarter",l:"秀"}],
        [{r:"eighth",l:"跟著"}, {r:"eighth",l:"點頭"}, {r:"offbeat",l:"絕"}, {r:"eighth",l:"不漏"}],
        [{r:"sixteenth",l:"劈哩啪啦"}, {r:"quarter",l:"炸"}, {r:"triplet",l:"麥克風"}, {r:"quarter",l:"燙"}],
        [{r:"eighth",l:"全場"}, {r:"long-short-short",l:"準備好"}, {r:"eighth",l:"起飛"}, {r:"quarter",l:"上"}]
      ],
      trap: [
        [{r:"triplet",l:"跑車上"}, {r:"triplet",l:"戴金鍊"}, {r:"quarter",l:"賺"}, {r:"quarter",l:"錢"}],
        [{r:"triplet",l:"兄弟們"}, {r:"triplet",l:"在身邊"}, {r:"quarter",l:"飛"}, {r:"quarter",l:"天"}],
        [{r:"sixteenth",l:"無時無刻"}, {r:"eighth",l:"保持"}, {r:"quarter",l:"帥"}, {r:"quarter",l:"氣"}],
        [{r:"long-short-short",l:"油門踩"}, {r:"quarter",l:"滿"}, {r:"eighth",l:"直衝"}, {r:"quarter",l:"底"}]
      ],
      pop: [
        [{r:"quarter",l:"愛"}, {r:"eighth",l:"你的"}, {r:"quarter",l:"心"}, {r:"quarter",l:"跳"}],
        [{r:"eighth",l:"撲通"}, {r:"eighth",l:"撲通"}, {r:"long-short-short",l:"在狂飆"}, {r:"quarter",l:"啊"}],
        [{r:"eighth",l:"不管"}, {r:"eighth",l:"走到"}, {r:"short-short-long",l:"哪裡去"}, {r:"quarter",l:"追"}],
        [{r:"eighth",l:"都會"}, {r:"eighth",l:"把你"}, {r:"eighth",l:"當作"}, {r:"quarter",l:"寶"}]
      ]
    };

    function loadPreset(key) {
      document.getElementById("lines-list").innerHTML = "";
      lineCounter = 0;
      presetData[key].forEach(line => addLine(line));
    }

    // UI 與音效控制
    function stop(){
      playing = false;
      timers.forEach(clearTimeout);
      timers = [];
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      document.querySelectorAll("[data-card]").forEach(c => c.classList.remove("active"));
      if (ctx) { ctx.close().catch(()=>{}); ctx = null; }
      stage(false, "READY / 等待開始", "--", "READY?", null);
    }

    function stage(on, status, line, lyric, imgSrc = null){
      document.getElementById("status-dot").classList.toggle("playing", on);
      document.getElementById("play-status").textContent = status;
      document.getElementById("active-line").textContent = line;
      document.getElementById("active-lyric").textContent = lyric;
      const imgEl = document.getElementById("active-img");
      if (on && imgSrc) { imgEl.src = imgSrc; imgEl.classList.remove("hidden"); } 
      else { imgEl.classList.add("hidden"); }
    }

    function ratios(type){
      return ({
        quarter: [0], eighth: [0, 0.5], triplet: [0, 1/3, 2/3],
        sixteenth: [0, 0.25, 0.5, 0.75], "long-short-short": [0, 0.5, 0.75],
        "short-short-long": [0, 0.25, 0.5], offbeat: [0.5]
      })[type] || [0];
    }

    // --- 音效合成器 ---
    function kick(audio, time, dest){
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.setValueAtTime(160, time);
      o.frequency.exponentialRampToValueAtTime(30, time + 0.16);
      g.gain.setValueAtTime(0.9, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.17);
      o.connect(g); g.connect(dest);
      o.start(time); o.stop(time + 0.18);
    }

    function snare(audio, time, dest, vol = 0.5){
      const bufferSize = audio.sampleRate * 0.12;
      const buffer = audio.createBuffer(1, bufferSize, audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audio.createBufferSource(); noise.buffer = buffer;
      const filter = audio.createBiquadFilter(); filter.type = "highpass"; filter.frequency.value = 1000;
      const noiseGain = audio.createGain();
      noiseGain.gain.setValueAtTime(vol * 0.8, time);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
      noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(dest);

      const osc = audio.createOscillator(), oscGain = audio.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(180, time);
      osc.frequency.exponentialRampToValueAtTime(80, time + 0.07);
      oscGain.gain.setValueAtTime(vol, time);
      oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
      osc.connect(oscGain); oscGain.connect(dest);

      osc.start(time); osc.stop(time + 0.1);
      noise.start(time); noise.stop(time + 0.12);
    }

    function hihat(audio, time, dest, vol = 0.4){
      const bufferSize = audio.sampleRate * 0.05;
      const buffer = audio.createBuffer(1, bufferSize, audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audio.createBufferSource(); noise.buffer = buffer;
      const filter = audio.createBiquadFilter(); filter.type = "highpass"; filter.frequency.value = 7000;
      const gain = audio.createGain();
      gain.gain.setValueAtTime(vol, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
      noise.connect(filter); filter.connect(gain); gain.connect(dest);
      noise.start(time); noise.stop(time + 0.05);
    }
    // ------------------

    async function perform(isRecording = false){
      initOrUnlockAudio();
      const all = [...document.querySelectorAll("[data-card]")];
      if(all.length === 0){
        alert("請至少新增一句節拍！"); return;
      }
      stop(); initOrUnlockAudio();

      const masterGain = ctx.createGain(); masterGain.connect(ctx.destination);

      if (isRecording) {
        const streamDest = ctx.createMediaStreamDestination();
        masterGain.connect(streamDest);
        recordedChunks = [];
        let mimeType = (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
        try {
          mediaRecorder = mimeType ? new MediaRecorder(streamDest.stream, { mimeType }) : new MediaRecorder(streamDest.stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `custom_beat.webm`; a.click();
            URL.revokeObjectURL(url);
          };
          mediaRecorder.start();
        } catch(e) { alert("瀏覽器不支援直接下載功能"); }
      }

      await ctx.resume();
      playing = true;
      const currentBpm = parseInt(document.getElementById("bpm-range").value) || 85;
      const dur = 60 / currentBpm;
      
      const doCountIn = document.getElementById("count-in-toggle").checked;
      const subSound = document.getElementById("subbeat-sound").value; 
      
      let start = ctx.currentTime + 0.1;

      // 預備倒數 (Count-in) 4 拍
      if (doCountIn) {
        for(let i=0; i<4; i++) {
          const t = start + i * dur;
          timers.push(setTimeout(() => {
            if(!playing) return;
            stage(true, "COUNT-IN / 準備倒數", "進歌前預備", (i+1).toString(), rhythms[0][2]);
          }, Math.max(0, (t - ctx.currentTime) * 1000)));
          hihat(ctx, t, masterGain, 0.7); // 倒數用清晰的 Hi-hat
        }
        start += 4 * dur; // 實際進歌延後 4 拍
      }

      all.forEach((card, index) => {
        const type = card.querySelector(".rhythm").value;
        const lyric = card.querySelector(".lyric").value.trim();
        const when = start + index * dur;
        const line = Math.floor(index/4) + 1;
        const beatNo = index % 4 + 1;
        const pattern = ratios(type);
        const rhythmObj = rhythms.find(r => r[0] === type);

        timers.push(setTimeout(() => {
          if(!playing) return;
          document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
          card.classList.add("active");
          stage(true, isRecording ? "RECORDING / 錄音中" : "LIVE / 播放中", `第 ${line} 句 · 第 ${beatNo} 拍`, lyric || "—", rhythmObj ? rhythmObj[2] : null);
        }, Math.max(0, (when - ctx.currentTime) * 1000)));

        // 主節拍：1、3 大鼓, 2、4 小鼓
        if (beatNo === 1 || beatNo === 3) kick(ctx, when, masterGain);
        else snare(ctx, when, masterGain, 0.6);

        // 細分節拍音效判斷 (依據選項切換 Hi-hat 或 Snare)
        pattern.forEach((ratio) => {
          if (ratio === 0) return;
          if (subSound === 'hihat') hihat(ctx, when + ratio * dur, masterGain, 0.5);
          else snare(ctx, when + ratio * dur, masterGain, 0.35);
        });
      });

      const end = (all.length * dur + (doCountIn ? 4*dur : 0) + 0.4) * 1000;
      timers.push(setTimeout(() => {
        playing = false;
        document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
        stage(false, "DONE / 結束", "--", "MIC DROP", null);
        if(isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if(ctx){ ctx.close().catch(()=>{}); ctx=null; }
      }, end));
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 初始預設載入一首 4 句範例
      loadPreset('boombap');
      
      const bpmInput = document.getElementById("bpm-range");
      bpmInput.addEventListener("input", (e) => document.getElementById("bpm-val").textContent = e.target.value + " BPM");

      document.getElementById("play-button").onclick = () => perform(false);
      document.getElementById("download-button").onclick = () => perform(true);
      document.getElementById("stop-button").onclick = stop;

      ['play-button', 'download-button'].forEach(id => {
        document.getElementById(id).addEventListener("touchstart", initOrUnlockAudio, { passive: true });
      });
      lucide.createIcons();
    });
  </script>
</body>
</html>
