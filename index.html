<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自訂節拍與饒舌產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #fefce8; color: #451a03; font-family: sans-serif; touch-action: manipulation; }
    .active { border-color: #d97706 !important; background-color: #fef3c7 !important; box-shadow: 0 0 12px rgba(217, 119, 6, 0.3); }
    .playing { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
    .beat-card { padding: 1rem; border-radius: 0.5rem; border: 1px solid #fde68a; background-color: #ffffff; }
    .field { width: 100%; padding: 0.5rem; border-radius: 0.25rem; background: #fffbebf0; color: #451a03; border: 1px solid #fcd34d; outline: none; }
    .field:focus { border-color: #d97706; }
    .rhythm-img { height: 40px; margin: 0 auto; object-fit: contain; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-2xl md:text-3xl font-bold text-center text-amber-800 mb-6">自訂節拍與饒舌產生器</h1>

    <!-- 控制面板 -->
    <div class="bg-amber-100/90 border border-amber-300 p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between shadow-md">
      <div class="flex flex-wrap items-center gap-3">
        <button id="play-button" class="bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-bold transition select-none shadow">
          <i data-lucide="play" class="w-5 h-5"></i> 實時播放
        </button>
        <button id="download-button" class="bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-bold transition select-none shadow">
          <i data-lucide="download" class="w-5 h-5"></i> 下載節拍檔
        </button>
        <button id="stop-button" class="bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 font-bold transition select-none shadow">
          <i data-lucide="square" class="w-5 h-5"></i> 停止
        </button>
      </div>
      <div class="text-xs text-amber-800 font-medium">※ 純樂器節拍模式（不含語音）</div>
    </div>

    <!-- 狀態面板 (亮色系 + 同步顯示文字與圖片) -->
    <div class="bg-amber-100/90 border border-amber-300 p-4 rounded-xl flex items-center gap-4 shadow-md">
      <div id="status-dot" class="w-4 h-4 rounded-full bg-amber-400 transition-colors"></div>
      <div id="play-status" class="font-bold text-amber-900">READY / 等待開始</div>
      <div id="active-line" class="text-amber-700 text-sm">第一句 · 第 1 拍</div>
      
      <!-- 動態節奏圖片與歌詞文字 -->
      <div class="ml-auto flex items-center gap-3 bg-white px-4 py-1.5 rounded-lg border border-amber-200 min-w-[140px] justify-end">
        <img id="active-img" class="h-8 w-auto object-contain hidden" alt="當前節奏">
        <div id="active-lyric" class="text-amber-950 font-mono text-xl font-bold">READY?</div>
      </div>
    </div>

    <!-- 節拍參考區 -->
    <div class="grid grid-cols-2 md:grid-cols-7 gap-2" id="guide-list"></div>

    <!-- 歌詞編輯區 -->
    <div class="space-y-4" id="lines-list"></div>
  </div>

  <script>
    const rhythms = [
      ["quarter", "一拍", "images/img_1.png"],
      ["eighth", "兩個半拍", "images/img_2.png"],
      ["triplet", "三連音", "images/img_3.png"],
      ["sixteenth", "四個1/4拍", "images/img_4.png"],
      ["long-short-short", "長短短", "images/img_5.png"],
      ["short-short-long", "短短長", "images/img_6.png"],
      ["offbeat", "後半拍", "images/img_7.png"]
    ];

    const rhythmWordLimits = {
      "quarter": 1, "eighth": 2, "triplet": 3, "sixteenth": 4,
      "long-short-short": 3, "short-short-long": 3, "offbeat": 1
    };

    let ctx = null, timers = [], playing = false;
    let mediaRecorder = null, recordedChunks = [];

    function initOrUnlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!ctx && AC) {
        ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') {
        ctx.resume();
      }
    }

    function cardsMarkup(line){
      return Array.from({length:4},(_,i)=>`<div class="beat-card" data-card>
        <div class="flex justify-between mb-2"><span class="font-bold text-amber-800">${i+1}</span><span class="text-[10px] text-amber-600 font-semibold">BEAT</span></div>
        <div class="mb-4 text-center h-10 flex items-center justify-center">
            <img data-symbol src="images/img_1.png" class="rhythm-img" alt="音符">
        </div>
        <label class="sr-only" for="r${line}-${i}">節奏</label>
        <select id="r${line}-${i}" class="field rhythm mb-2 text-sm font-medium">${rhythms.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("")}</select>
        <label class="sr-only" for="t${line}-${i}">歌詞</label>
        <input id="t${line}-${i}" class="field lyric text-center font-bold text-lg" type="text" placeholder="最多 1 字">
      </div>`).join("");
    }

    function updateInputLimit(selectElement) {
      const type = selectElement.value;
      const maxLen = rhythmWordLimits[type];
      const input = selectElement.closest("[data-card]").querySelector(".lyric");
      input.maxLength = maxLen;
      input.placeholder = `最多 ${maxLen} 字`;
      if (input.value.length > maxLen) {
        input.value = input.value.substring(0, maxLen);
      }
    }

    function build(){
      document.getElementById("guide-list").innerHTML = rhythms.map(r=>`
        <div class="rounded-xl border border-amber-200 bg-amber-100/70 p-2 text-center">
            <div class="h-10 flex items-center justify-center mb-1">
                <img src="${r[2]}" alt="${r[1]}" class="rhythm-img" onerror="this.outerHTML='<span class=\\'text-xs text-red-500\\'>圖片遺失</span>'">
            </div>
            <p class="text-center text-[11px] text-amber-900 font-bold">${r[1]}</p>
        </div>`).join("");

      document.getElementById("lines-list").innerHTML = ["第一句","第二句","第三句","第四句"].map((name,i)=>`
        <section class="rounded-2xl border border-amber-300 bg-amber-100/80 p-4 shadow-md">
            <div class="flex justify-between mb-3"><h3 class="font-bold text-lg text-amber-900">${name}</h3><span class="text-xs text-amber-700">完成四拍</span></div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">${cardsMarkup(i)}</div>
        </section>`).join("");

      document.querySelectorAll(".rhythm").forEach(s => {
        s.addEventListener("change", () => {
          const imgPath = rhythms.find(r => r[0] === s.value)[2];
          s.closest("[data-card]").querySelector("[data-symbol]").src = imgPath;
          updateInputLimit(s);
        });
        updateInputLimit(s);
      });
    }

    function stop(){
      playing = false;
      timers.forEach(clearTimeout);
      timers = [];
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      document.querySelectorAll("[data-card]").forEach(c => c.classList.remove("active"));
      if (ctx) { ctx.close().catch(()=>{}); ctx = null; }
      stage(false, "READY / 等待開始", "第一句 · 第 1 拍", "READY?", null);
    }

    function stage(on, status, line, lyric, imgSrc = null){
      document.getElementById("status-dot").classList.toggle("playing", on);
      document.getElementById("play-status").textContent = status;
      document.getElementById("active-line").textContent = line;
      document.getElementById("active-lyric").textContent = lyric;

      const imgEl = document.getElementById("active-img");
      if (on && imgSrc) {
        imgEl.src = imgSrc;
        imgEl.classList.remove("hidden");
      } else {
        imgEl.classList.add("hidden");
      }
    }

    function ratios(type){
      return ({
        quarter: [0],
        eighth: [0, 0.5],
        triplet: [0, 1/3, 2/3],
        sixteenth: [0, 0.25, 0.5, 0.75],
        "long-short-short": [0, 0.5, 0.75],
        "short-short-long": [0, 0.25, 0.5],
        offbeat: [0.5]
      })[type] || [0];
    }

    // 重低音大鼓 (Kick)
    function kick(audio, time, dest){
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.setValueAtTime(150, time);
      o.frequency.exponentialRampToValueAtTime(35, time + 0.15);

      g.gain.setValueAtTime(0.8, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.16);

      o.connect(g); g.connect(dest);
      o.start(time); o.stop(time + 0.18);
    }

    // 合成小鼓音效 (Snare Drum - 替代原高音 Click)
    function snare(audio, time, dest){
      // 1. 白雜音 (響弦聲)
      const bufferSize = audio.sampleRate * 0.15;
      const buffer = audio.createBuffer(1, bufferSize, audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audio.createBufferSource();
      noise.buffer = buffer;

      const filter = audio.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 1000;

      const noiseGain = audio.createGain();
      noiseGain.gain.setValueAtTime(0.4, time);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(dest);

      // 2. 鼓腔擊打聲
      const osc = audio.createOscillator();
      const oscGain = audio.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(180, time);
      osc.frequency.exponentialRampToValueAtTime(80, time + 0.08);

      oscGain.gain.setValueAtTime(0.5, time);
      oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.09);

      osc.connect(oscGain);
      oscGain.connect(dest);

      osc.start(time);
      osc.stop(time + 0.12);
      noise.start(time);
      noise.stop(time + 0.15);
    }

    // 細分拍聲音
    function tone(audio, time, freq, duration, dest){
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, time);
      gain.gain.setValueAtTime(0.3, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

      osc.connect(gain); gain.connect(dest);
      osc.start(time); osc.stop(time + duration + 0.02);
    }

    async function perform(isRecording = false){
      initOrUnlockAudio();

      const all = [...document.querySelectorAll("[data-card]")];
      const hasContent = all.some(c => c.querySelector(".lyric").value.trim() !== "");
      if(!hasContent){
        stage(false, "請先填入歌詞", "第一句 · 第 1 拍", "先寫一拍歌詞", null);
        return;
      }

      stop();
      initOrUnlockAudio();

      const masterGain = ctx.createGain();
      masterGain.connect(ctx.destination);

      if (isRecording) {
        const streamDest = ctx.createMediaStreamDestination();
        masterGain.connect(streamDest);
        recordedChunks = [];
        
        let mimeType = '';
        if (typeof MediaRecorder !== 'undefined') {
          if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
          else if (MediaRecorder.isTypeSupported('audio/aac')) mimeType = 'audio/aac';
          else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
        }
        
        try {
          mediaRecorder = mimeType ? new MediaRecorder(streamDest.stream, { mimeType }) : new MediaRecorder(streamDest.stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const ext = mimeType.includes('mp4') || mimeType.includes('aac') ? 'm4a' : 'webm';
            const blob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `custom_beat.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
          };
          mediaRecorder.start();
        } catch(e) {
          alert("您的手機瀏覽器不支援直接下載音檔功能");
        }
      }

      await ctx.resume();
      playing = true;
      const bpm = 70, dur = 60/bpm;
      const start = ctx.currentTime + 0.1;

      all.forEach((card, index) => {
        const type = card.querySelector(".rhythm").value;
        const lyric = card.querySelector(".lyric").value.trim();
        const when = start + index * dur;
        const line = Math.floor(index/4) + 1;
        const beatNo = index % 4 + 1;
        const pattern = ratios(type);

        const rhythmObj = rhythms.find(r => r[0] === type);
        const imgSrc = rhythmObj ? rhythmObj[2] : null;

        // LIVE 播放狀態：同步顯示文字與節奏圖片
        timers.push(setTimeout(() => {
          if(!playing) return;
          document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
          card.classList.add("active");
          stage(true, isRecording ? "RECORDING / 錄音中" : "LIVE / 播放中", `第${["一","二","三","四"][line-1]}句 · 第 ${beatNo} 拍`, lyric || "—", imgSrc);
        }, Math.max(0, (when - ctx.currentTime) * 1000)));

        // 節拍發聲：1、3拍擊打大鼓，2、4拍擊打小鼓 (Snare)
        if (beatNo === 1 || beatNo === 3) {
          kick(ctx, when, masterGain);
        } else {
          snare(ctx, when, masterGain);
        }

        // 細分節拍發聲
        pattern.forEach((ratio, p) => {
          if (ratio === 0) return;
          const next = pattern[p+1] ?? 1;
          const noteDuration = Math.max(.06, (next-ratio) * dur * .6);
          tone(ctx, when + ratio * dur, 320 + p*40, noteDuration, masterGain);
        });
      });

      const end = (all.length * dur + 0.4) * 1000;
      timers.push(setTimeout(() => {
        playing = false;
        document.querySelectorAll("[data-card]").forEach(x => x.classList.remove("active"));
        stage(false, "DONE / 節拍結束", "完成", "MIC DROP", null);
        if(isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if(ctx){ ctx.close().catch(()=>{}); ctx=null; }
      }, end));
    }

    document.addEventListener("DOMContentLoaded", () => {
      build();
      const playBtn = document.getElementById("play-button");
      const downloadBtn = document.getElementById("download-button");
      const stopBtn = document.getElementById("stop-button");

      playBtn.onclick = () => perform(false);
      downloadBtn.onclick = () => perform(true);
      stopBtn.onclick = stop;

      playBtn.addEventListener("touchstart", initOrUnlockAudio, { passive: true });
      downloadBtn.addEventListener("touchstart", initOrUnlockAudio, { passive: true });

      lucide.createIcons();
    });
  </script>
</body>
</html>
